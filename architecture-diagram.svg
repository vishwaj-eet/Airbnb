<svg viewBox="0 0 1400 900" width="1400" height="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#090d16"/>
      <stop offset="50%" stopColor="#0f172a"/>
      <stop offset="100%" stopColor="#1e293b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF385C"/>
      <stop offset="100%" stopColor="#D70466"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2563eb"/>
      <stop offset="100%" stopColor="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#059669"/>
      <stop offset="100%" stopColor="#047857"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#7c3aed"/>
      <stop offset="100%" stopColor="#5b21b6"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#d97706"/>
      <stop offset="100%" stopColor="#b45309"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="url(#bgGrad)"/>

  <!-- Title Banner -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="1280" height="65" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="36" cy="32" r="16" fill="url(#primaryGrad)"/>
    <path d="M36 21 c1.5 0 2.6.7 3.5 2.4 l.4.8 c1.4 2.8 3 6.1 4.5 9.4 1.2 2.7 1.9 4.7 1.9 6.4 0 3.2-2.4 5.1-5.8 5.1 -2.5 0-4.4-1.1-5.5-3.1 -1 2-3 3.1-5.5 3.1 -3.4 0-5.8-1.9-5.8-5.1 0-1.7.7-3.7 1.9-6.4 1.5-3.3 3.1-6.6 4.5-9.4 l.4-.8 c.9-1.7 2-2.4 3.5-2.4 z" fill="#ffffff" transform="scale(0.65) translate(19, 16)"/>
    <text x="65" y="32" fill="#ffffff" font-size="20" font-weight="bold">Vacation Rental Marketplace — Production Scale Architecture</text>
    <text x="65" y="50" fill="#94a3b8" font-size="12">Scaling Strategy: 100M+ Monthly Visits · Sub-50ms Search · Multi-Region Active-Active · Zero Double-Booking Guarantee</text>
    <rect x="1110" y="18" width="145" height="28" rx="14" fill="#0f172a" stroke="#FF385C" stroke-width="1.5"/>
    <text x="1182" y="36" fill="#FF385C" font-size="11" font-weight="bold" text-anchor="middle">Airbnb Scale Target</text>
  </g>

  <!-- TIER 1: CLIENTS & GLOBAL EDGE -->
  <g transform="translate(60, 125)">
    <rect x="0" y="0" width="1280" height="110" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="25" y="26" fill="#f43f5e" font-size="11" font-weight="bold" letter-spacing="1.5">TIER 1: CLIENTS &amp; GLOBAL EDGE ACCELERATION</text>
    
    <!-- Next.js Client -->
    <rect x="25" y="42" width="220" height="52" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
    <text x="135" y="66" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Next.js / React Web</text>
    <text x="135" y="83" fill="#94a3b8" font-size="10.5" text-anchor="middle">SSR / ISR Hydration · Tailwind</text>

    <!-- Mobile Apps -->
    <rect x="265" y="42" width="220" height="52" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
    <text x="375" y="66" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Mobile iOS / Android</text>
    <text x="375" y="83" fill="#94a3b8" font-size="10.5" text-anchor="middle">React Native / Swift / Kotlin</text>

    <!-- Edge CDN Box -->
    <rect x="510" y="40" width="745" height="56" rx="10" fill="url(#primaryGrad)"/>
    <text x="882" y="66" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Global Anycast Edge Network (Cloudflare + CloudFront 310+ POPs)</text>
    <text x="882" y="84" fill="#ffe4e6" font-size="11" text-anchor="middle">DDoS L3/L4/L7 Mitigation · On-Demand ISR Edge Cache Purging · TLS 1.3 Termination · WebP/AVIF Image Transcoding</text>
  </g>

  <!-- Flow Connector 1 -->
  <line x1="700" y1="235" x2="700" y2="265" stroke="#FF385C" stroke-width="3" stroke-dasharray="6,6"/>
  <polygon points="694,260 700,270 706,260" fill="#FF385C"/>

  <!-- TIER 2: API GATEWAY & SECURITY -->
  <g transform="translate(60, 270)">
    <rect x="0" y="0" width="1280" height="105" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="25" y="26" fill="#38bdf8" font-size="11" font-weight="bold" letter-spacing="1.5">TIER 2: API GATEWAY, RATE LIMITING &amp; BACKEND-FOR-FRONTEND (BFF)</text>

    <rect x="25" y="40" width="290" height="50" rx="10" fill="url(#blueGrad)"/>
    <text x="170" y="64" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Envoy Proxy &amp; WAF Gateway</text>
    <text x="170" y="80" fill="#bfdbfe" font-size="10.5" text-anchor="middle">mTLS · SSL Decryption · Circuit Breaking</text>

    <rect x="335" y="40" width="290" height="50" rx="10" fill="#0f172a" stroke="#2563eb" stroke-width="1.2"/>
    <text x="480" y="64" fill="#93c5fd" font-size="13" font-weight="bold" text-anchor="middle">Token Bucket Rate Limiter</text>
    <text x="480" y="80" fill="#cbd5e1" font-size="10.5" text-anchor="middle">IP, User &amp; API Key Quota Throttling</text>

    <rect x="645" y="40" width="290" height="50" rx="10" fill="#0f172a" stroke="#2563eb" stroke-width="1.2"/>
    <text x="790" y="64" fill="#93c5fd" font-size="13" font-weight="bold" text-anchor="middle">JWT &amp; OAuth2 Identity</text>
    <text x="790" y="80" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Stateless Signature Check (&lt;2ms)</text>

    <rect x="955" y="40" width="300" height="50" rx="10" fill="#0f172a" stroke="#2563eb" stroke-width="1.2"/>
    <text x="1105" y="64" fill="#93c5fd" font-size="13" font-weight="bold" text-anchor="middle">GraphQL Federation / REST BFF</text>
    <text x="1105" y="80" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Apollo Federation Subgraph Router</text>
  </g>

  <!-- Flow Connector 2 -->
  <line x1="700" y1="375" x2="700" y2="405" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,6"/>
  <polygon points="694,400 700,410 706,400" fill="#38bdf8"/>

  <!-- TIER 3: CORE MICROSERVICES -->
  <g transform="translate(60, 410)">
    <rect x="0" y="0" width="1280" height="125" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="25" y="26" fill="#c084fc" font-size="11" font-weight="bold" letter-spacing="1.5">TIER 3: CORE BUSINESS DOMAIN MICROSERVICES (KUBERNETES EKS HPA)</text>

    <!-- Svc 1 -->
    <rect x="25" y="42" width="230" height="68" rx="10" fill="url(#purpleGrad)"/>
    <text x="140" y="66" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Listing &amp; Inventory</text>
    <text x="140" y="83" fill="#e9d5ff" font-size="10.5" text-anchor="middle">Metadata, Rules, Photos</text>
    <text x="140" y="98" fill="#d8b4fe" font-size="9.5" text-anchor="middle">gRPC · Event Producer</text>

    <!-- Svc 2 -->
    <rect x="275" y="42" width="235" height="68" rx="10" fill="url(#purpleGrad)"/>
    <text x="392" y="66" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Search &amp; Discovery</text>
    <text x="392" y="83" fill="#e9d5ff" font-size="10.5" text-anchor="middle">Geo-Distance, Price, Filters</text>
    <text x="392" y="98" fill="#d8b4fe" font-size="9.5" text-anchor="middle">Vector Embeddings Ranking</text>

    <!-- Svc 3 -->
    <rect x="530" y="42" width="240" height="68" rx="10" fill="url(#purpleGrad)"/>
    <text x="650" y="66" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Booking &amp; Saga Orchestrator</text>
    <text x="650" y="83" fill="#e9d5ff" font-size="10.5" text-anchor="middle">Distributed Lock (Redlock)</text>
    <text x="650" y="98" fill="#d8b4fe" font-size="9.5" text-anchor="middle">2-Phase Calendar Commit</text>

    <!-- Svc 4 -->
    <rect x="790" y="42" width="230" height="68" rx="10" fill="url(#purpleGrad)"/>
    <text x="905" y="66" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Dynamic Pricing Engine</text>
    <text x="905" y="83" fill="#e9d5ff" font-size="10.5" text-anchor="middle">Seasonality, Local Surge ML</text>
    <text x="905" y="98" fill="#d8b4fe" font-size="9.5" text-anchor="middle">15-min Guaranteed Quotes</text>

    <!-- Svc 5 -->
    <rect x="1040" y="42" width="215" height="68" rx="10" fill="url(#purpleGrad)"/>
    <text x="1147" y="66" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Payment &amp; Trust</text>
    <text x="1147" y="83" fill="#e9d5ff" font-size="10.5" text-anchor="middle">Stripe / Razorpay Webhooks</text>
    <text x="1147" y="98" fill="#d8b4fe" font-size="9.5" text-anchor="middle">Idempotent Transactions</text>
  </g>

  <!-- Flow Connector 3 -->
  <line x1="700" y1="535" x2="700" y2="565" stroke="#c084fc" stroke-width="3" stroke-dasharray="6,6"/>
  <polygon points="694,560 700,570 706,560" fill="#c084fc"/>

  <!-- TIER 4: STORAGE, SEARCH & EVENT STREAMING -->
  <g transform="translate(60, 570)">
    <rect x="0" y="0" width="1280" height="135" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="25" y="26" fill="#34d399" font-size="11" font-weight="bold" letter-spacing="1.5">TIER 4: STORAGE, REAL-TIME SEARCH &amp; EVENT BUS CLUSTERS</text>

    <!-- PostgreSQL Sharding -->
    <rect x="25" y="42" width="295" height="78" rx="10" fill="url(#emeraldGrad)"/>
    <text x="172" y="66" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">PostgreSQL Aurora Multi-Master</text>
    <text x="172" y="83" fill="#d1fae5" font-size="10.5" text-anchor="middle">Horizontally Sharded by listing_id</text>
    <text x="172" y="98" fill="#a7f3d0" font-size="9.5" text-anchor="middle">Strict Serializable Isolation (ACID)</text>
    <text x="172" y="111" fill="#6ee7b7" font-size="9" text-anchor="middle">Read Replicas across 3 Availability Zones</text>

    <!-- Redis Cluster -->
    <rect x="340" y="42" width="295" height="78" rx="10" fill="url(#emeraldGrad)"/>
    <text x="487" y="66" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Redis Availability Cluster</text>
    <text x="487" y="83" fill="#d1fae5" font-size="10.5" text-anchor="middle">Calendar Availability Bitmaps (365 days)</text>
    <text x="487" y="98" fill="#a7f3d0" font-size="9.5" text-anchor="middle">Sub-ms BITOP Range Queries</text>
    <text x="487" y="111" fill="#6ee7b7" font-size="9" text-anchor="middle">Redlock Distributed Concurrency Guard</text>

    <!-- Elasticsearch -->
    <rect x="655" y="42" width="300" height="78" rx="10" fill="url(#emeraldGrad)"/>
    <text x="805" y="66" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Elasticsearch / OpenSearch</text>
    <text x="805" y="83" fill="#d1fae5" font-size="10.5" text-anchor="middle">Spatial geo_point Candolim Coordinates</text>
    <text x="805" y="98" fill="#a7f3d0" font-size="9.5" text-anchor="middle">Facet Aggregations (Jacuzzi, Wi-Fi, Pool)</text>
    <text x="805" y="111" fill="#6ee7b7" font-size="9" text-anchor="middle">Sub-30ms P99 Query Latency</text>

    <!-- Kafka Event Spine -->
    <rect x="975" y="42" width="280" height="78" rx="10" fill="url(#emeraldGrad)"/>
    <text x="1115" y="66" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Apache Kafka Event Spine</text>
    <text x="1115" y="83" fill="#d1fae5" font-size="10.5" text-anchor="middle">Topics: booking.held, listing.updated</text>
    <text x="1115" y="98" fill="#a7f3d0" font-size="9.5" text-anchor="middle">At-Least-Once Delivery &amp; Replay</text>
    <text x="1115" y="111" fill="#6ee7b7" font-size="9" text-anchor="middle">Connectors to Search Index &amp; Analytics</text>
  </g>

  <!-- Flow Connector 4 -->
  <line x1="700" y1="705" x2="700" y2="735" stroke="#34d399" stroke-width="3" stroke-dasharray="6,6"/>
  <polygon points="694,730 700,740 706,730" fill="#34d399"/>

  <!-- TIER 5: ASSET STORAGE, ANALYTICS & DEPLOYMENT -->
  <g transform="translate(60, 740)">
    <rect x="0" y="0" width="1280" height="110" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="25" y="26" fill="#fbbf24" font-size="11" font-weight="bold" letter-spacing="1.5">TIER 5: GLOBAL OBJECT STORAGE, DATA LAKE &amp; MULTI-REGION DEPLOYMENT</text>

    <rect x="25" y="40" width="390" height="54" rx="10" fill="#0f172a" stroke="#d97706" stroke-width="1.2"/>
    <text x="220" y="63" fill="#fde68a" font-size="12.5" font-weight="bold" text-anchor="middle">Cloudflare R2 / AWS S3 + Sharp Pipeline</text>
    <text x="220" y="80" fill="#cbd5e1" font-size="10" text-anchor="middle">Direct Browser Presigned Upload · Automatic AVIF/WebP Resizing</text>

    <rect x="440" y="40" width="400" height="54" rx="10" fill="#0f172a" stroke="#d97706" stroke-width="1.2"/>
    <text x="640" y="63" fill="#fde68a" font-size="12.5" font-weight="bold" text-anchor="middle">Snowflake / ClickHouse Real-Time Analytics</text>
    <text x="640" y="80" fill="#cbd5e1" font-size="10" text-anchor="middle">OLAP Data Lakehouse · ML Pricing Training · Host Dashboard Metrics</text>

    <rect x="865" y="40" width="390" height="54" rx="10" fill="#0f172a" stroke="#d97706" stroke-width="1.2"/>
    <text x="1060" y="63" fill="#fde68a" font-size="12.5" font-weight="bold" text-anchor="middle">Multi-Region Kubernetes (EKS) + ArgoCD</text>
    <text x="1060" y="80" fill="#cbd5e1" font-size="10" text-anchor="middle">GitOps Automated Rollouts · OpenTelemetry Tracing · Datadog APM</text>
  </g>
</svg>
